[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesis-generacion"
version = "0.1.0.dev0"
description = "Implementación de técnicas de generación de números aleatorios para la tesis"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.23,<3",
    "scipy>=1.9,<2",
    "matplotlib>=3.6,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
